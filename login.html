<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Boogie's Pet Care Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-yellow: #ffcc00; /* Primary Yellow from FB Header */
            --brand-blue: #001f3f;   /* Deep Navy from FB Logo/Text */
            --brand-blue-light: #002d5b;
            --white: #ffffff;
            --light-gray: #f1f5f9;
            --text-gray: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--brand-yellow); /* Yellow background like the branding */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Back Button */
        .back-home {
            position: absolute;
            top: 25px;
            left: 25px;
            text-decoration: none;
            color: var(--brand-blue);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* Login Card */
        .login-card {
            background: var(--white);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border-bottom: 5px solid var(--brand-blue);
        }

        .login-icon {
            font-size: 45px;
            color: var(--brand-blue);
            margin-bottom: 15px;
        }

        h2 {
            margin: 0 0 5px 0;
            color: var(--brand-blue);
            font-size: 26px;
            font-weight: 800;
        }

        .branch-tag {
            font-size: 12px;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            display: block;
        }

        /* Form Styling */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--brand-blue);
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-yellow);
            background-color: #fffdf5;
        }

        /* Navy Button like the FB UI */
        .login-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--brand-blue);
            color: var(--brand-yellow);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            transition: transform 0.2s ease, opacity 0.3s;
        }

        .login-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .register-link {
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .register-link a {
            color: var(--brand-blue);
            text-decoration: none;
            font-weight: 700;
            border-bottom: 2px solid var(--brand-yellow);
        }

        /* Admin/Footer Section */
        .footer-links {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--light-gray);
        }

        .footer-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            margin: 0 10px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--brand-blue);
        }

        .brand-footer {
            margin-top: 15px;
            font-size: 11px;
            color: var(--brand-blue-light);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <a href="home.html" class="back-home">
        <i class="fas fa-chevron-left"></i> Back to Website
    </a>

    <div class="login-card">
        <div class="login-icon">
            <i class="fas fa-paw"></i>
        </div>
        
        <h2>Welcome Back!</h2>
        <span class="branch-tag">Dasmariñas Branch</span>

        <form action="login.php" method="POST">
    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required>
    </div>

    <button type="submit" name="login_btn" class="login-btn">Login to Account</button>
</form>

        <div class="register-link">
            New fur-parent? <a href="register.html">Register here</a>
        </div>

        <div class="footer-links">
            <a href="#"><i class="fas fa-user-shield"></i> Admin Login</a>
            <a href="#"><i class="fas fa-question-circle"></i> Help</a>
        </div>

        <div class="brand-footer">
            © 2026 Boogie's Pet Care Services
        </div>
    </div>

</body>
</html>
